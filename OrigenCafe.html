<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14100e">
<title>一咖舍 · 经营计算器</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
  .tab,.item,.emp,.day,.cyc,.reset,button{touch-action:manipulation}
  :root{
    --bg:#14100e; --card:#211a17; --card2:#2a221e;
    --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
    --tx:#f3ece5; --tx2:#a99a8d; --tx3:#7a6c61;
    --gold:#e0a95f; --gold2:#f0c88a; --teal:#4fb3c8;
    --nav-h:78px;              /* 底部菜单栏高度，JS 会按实测值（含安全区）覆盖 */
  }
  /* 注意 1：html / body 都不能用固定 height:100%。
     html 的盒子若被钉在视口高度，绘制在 canvas 上的 body 背景就只按"一个
     视口"来定位，往下滚动渐变会消失、只剩纯色。
     注意 2：body 若设成固定 height，作为 flex 容器会把 .app 子项压扁，
     导致 .app 的 padding-bottom 失效、内容溢出到固定底栏之下。
     结论：两者都用 min-height，让盒子随内容自然撑高。 */
  html{min-height:100%}
  body{min-height:100vh; min-height:100svh}
  body{
    /* 三层叠加：顶部暖光 + 右下暖光 + 贯穿全页的底色渐变。
       百分比尺寸按"整个文档高度"计算，因此渐变会随页面一起铺满、跟着内容滚动；
       底部那层 linear-gradient 保证页面中段也不会是一块死平色。 */
    background:
      radial-gradient(120% 60% at 50% -10%, #3a2a1e 0%, rgba(58,42,30,0) 60%),
      radial-gradient(80%  40% at 90% 105%, #2a1e1a 0%, rgba(42,30,26,0) 60%),
      linear-gradient(180deg,#1b1512 0%,#15110f 45%,#120f0d 100%),
      var(--bg);
    background-repeat:no-repeat;
    color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.5;
    display:flex; flex-direction:column; align-items:center; min-height:100vh; min-height:100svh;
  }
  .app{width:100%; max-width:520px; min-height:100vh; min-height:100svh;
    display:flex; flex-direction:column; position:relative;
    padding-bottom:92px;                              /* 兜底：菜单栏 78px + 14px 留白 */
    padding-bottom:calc(var(--nav-h) + 14px)}
  .main{display:flex; flex-direction:column; min-width:0}
  .app>.main{flex:1}

  header{padding:22px 18px 14px}
  .brand{display:flex; align-items:center; gap:10px}
  .logo{width:34px;height:34px;border-radius:11px;flex:none;
    background:linear-gradient(145deg,var(--gold2),#b8752f);
    display:flex;align-items:center;justify-content:center;font-size:18px;
    box-shadow:0 4px 14px rgba(224,169,95,.28)}
  h1{font-size:17px; font-weight:600; letter-spacing:.5px}
  .sub{font-size:11px; color:var(--tx3); letter-spacing:2px; margin-top:1px}
  .hd-right{margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:7px}
  .hd-date{text-align:right; font-size:11px; color:var(--tx3)}
  .hd-date b{display:block; color:var(--tx2); font-size:12px; font-weight:500}

  /* 中英切换开关 */
  .lang-sw{display:flex; align-items:center; gap:2px; padding:2px; border-radius:9px; flex:none;
    background:rgba(255,255,255,.05); border:1px solid var(--line2); cursor:pointer;
    -webkit-user-select:none; user-select:none; transition:.18s}
  .lang-sw:active{background:rgba(255,255,255,.09)}
  .lang-sw span{font-size:10px; font-weight:600; padding:3px 7px; border-radius:7px; line-height:1.2;
    color:var(--tx3); transition:.18s; white-space:nowrap}
  .lang-sw span.on{background:linear-gradient(145deg,var(--gold2),#c98a3c); color:#1a1411;
    box-shadow:0 2px 8px -2px rgba(224,169,95,.7)}

  /* 英文排版微调：英文单词更长，压缩字号避免换行/溢出 */
  html[lang="en"] h1{font-size:14.5px; letter-spacing:.1px}
  html[lang="en"] .sub{font-size:9.5px; letter-spacing:1.4px; text-transform:uppercase}
  html[lang="en"] .cyc{font-size:9px; letter-spacing:-.1px}
  html[lang="en"] .nm{letter-spacing:0}
  html[lang="en"] .day.eff .dc::after{content:"ON"}
  html[lang="en"] td{font-size:12px}
  html[lang="en"] .tbl td:first-child{font-size:11.5px}
  html[lang="en"] .note p{font-size:11px}
  html[lang="en"] .emp .en{font-size:12px; line-height:1.3}

  .hero{margin:0 14px 14px; border-radius:20px; padding:16px 16px 14px; position:relative; overflow:hidden;
    background:linear-gradient(150deg,#2d221b 0%,#1e1815 70%); border:1px solid var(--line2)}
  .hero::after{content:""; position:absolute; right:-50px; top:-60px; width:170px; height:170px; border-radius:50%;
    background:radial-gradient(circle,var(--cat-glow,rgba(224,169,95,.30)) 0%,transparent 70%)}
  .hero-top{display:flex; align-items:flex-start; justify-content:space-between; position:relative; gap:10px}
  .hero-lbl{font-size:11px; color:var(--tx3); letter-spacing:1.5px}
  .hero-date{font-size:12.5px;color:var(--tx2); margin-top:4px; display:flex; align-items:center; gap:6px}
  .hero-date input{background:rgba(0,0,0,.3); border:1px solid var(--line2); color:var(--tx);
    border-radius:8px; padding:4px 8px; font-size:12px; font-family:inherit; outline:none}
  .chip{display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:999px;
    font-size:13px; font-weight:600; letter-spacing:.5px; background:var(--cat-bg); color:#fff;
    box-shadow:0 3px 12px rgba(0,0,0,.3)}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.85)}
  .chip-add{font-size:11px; opacity:.85; font-weight:500}
  .cycle{display:flex; gap:5px; margin-top:14px; position:relative}
  .cyc{flex:1; text-align:center; padding:5px 2px; border-radius:8px; font-size:10.5px; color:var(--tx3);
    background:rgba(255,255,255,.035); border:1px solid transparent; transition:.2s}
  .cyc.on{color:#fff; background:var(--cat-bg); border-color:rgba(255,255,255,.25); font-weight:600}

  .hero-note{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px; padding-top:11px;
    border-top:1px solid rgba(255,255,255,.07); font-size:10.5px; color:var(--tx3); position:relative}
  .hero-note .hn-a{display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
  .hero-note .pl{width:5px; height:5px; border-radius:50%; background:var(--gold2); flex:none;
    box-shadow:0 0 0 0 rgba(240,200,138,.6); animation:pl 2.2s infinite}
  @keyframes pl{0%{box-shadow:0 0 0 0 rgba(240,200,138,.55)}70%{box-shadow:0 0 0 6px rgba(240,200,138,0)}100%{box-shadow:0 0 0 0 rgba(240,200,138,0)}}
  .hero-note .hn-b{margin-left:auto; white-space:nowrap}
  .hero-note .hn-b b{color:var(--tx2); font-variant-numeric:tabular-nums; font-weight:600}
  .auto-btn{display:none; margin-top:7px; font-size:10.5px; padding:4px 9px; border-radius:8px; cursor:pointer;
    background:rgba(224,169,95,.14); color:var(--gold2); border:1px solid rgba(224,169,95,.3); white-space:nowrap}
  .auto-btn:active{background:rgba(224,169,95,.24)}

  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:0 14px 16px}
  .st{background:var(--card); border:1px solid var(--line); border-radius:15px; padding:12px 10px; text-align:center}
  .st .k{font-size:10.5px; color:var(--tx3); letter-spacing:.4px; white-space:nowrap}
  .st .v{font-size:18px; font-weight:700; margin-top:5px; letter-spacing:-.3px; font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,var(--gold2)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .st .u{font-size:10px; color:var(--tx3); margin-left:1px; -webkit-text-fill-color:var(--tx3)}

  .views{flex:1; padding:0 14px}
  .view{display:none; animation:fade .28s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

  .sec-t{display:flex; align-items:center; justify-content:space-between; margin:2px 2px 10px}
  .sec-t h2{font-size:13.5px; font-weight:600; letter-spacing:.3px}
  .sec-t span{font-size:11px; color:var(--tx3)}

  .list{display:flex; flex-direction:column; gap:9px}
  .item{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:13px 14px;
    display:flex; align-items:center; gap:12px; transition:.18s; position:relative; overflow:hidden}
  .item.sel{border-color:rgba(224,169,95,.42); background:linear-gradient(100deg,#241c17,#211a17)}
  .item.hit{box-shadow:inset 0 0 0 1px var(--cat-c), 0 0 22px -8px var(--cat-c)}
  .tick{width:20px;height:20px;border-radius:7px;flex:none; border:1.5px solid var(--line2);
    display:flex;align-items:center;justify-content:center; transition:.18s}
  .item.sel .tick{background:linear-gradient(145deg,var(--gold2),#c98a3c); border-color:transparent}
  .tick svg{width:12px;height:12px;opacity:0;transition:.18s}
  .item.sel .tick svg{opacity:1}
  .info{flex:1; min-width:0}
  .nm{font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px}
  .tag{font-size:9.5px; padding:1.5px 6px; border-radius:5px; background:var(--cat-bg); color:#fff; font-weight:500; flex:none}
  .mt{font-size:11px; color:var(--tx3); margin-top:3px; display:flex; gap:9px; flex-wrap:wrap}
  .mt b{color:var(--tx2); font-weight:500; font-variant-numeric:tabular-nums}
  .earn{text-align:right; flex:none}
  .earn .n{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.2px}
  .earn .d{font-size:10px; color:var(--tx3); margin-top:2px}
  .earn .up{color:var(--gold2)}

  /* ---------- 未选商品折叠 ---------- */
  .hide{display:none !important}
  .idle-wrap{margin-top:14px}
  .fold{display:none; align-items:center; gap:7px; cursor:pointer; transition:.18s;
    font-size:11.5px; color:var(--tx3); padding:10px 13px; border-radius:13px;
    background:rgba(255,255,255,.022); border:1px dashed var(--line2);
    -webkit-user-select:none; user-select:none}
  .fold.on{display:flex}
  .fold:active{background:rgba(255,255,255,.05)}
  .fold .arw{width:13px; height:13px; display:flex; align-items:center; justify-content:center;
    flex:none; transition:transform .22s ease}
  .fold .arw svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2.6;
    stroke-linecap:round; stroke-linejoin:round}
  .fold.open .arw{transform:rotate(90deg)}
  .list.minis{margin-top:8px; gap:6px; grid-template-columns:1fr}
  .item.mini{padding:9px 12px; gap:9px; border-radius:12px;
    background:rgba(255,255,255,.022); border-color:var(--line)}
  .item.mini .tick{width:17px; height:17px; border-radius:6px}
  .item.mini .tick svg{width:10px; height:10px}
  .item.mini .nm{flex:1; font-size:13px; font-weight:500; color:var(--tx2); letter-spacing:0}
  .item.mini .pv{font-size:12.5px; font-weight:600; color:var(--tx3); font-variant-numeric:tabular-nums; flex:none}
  .item.mini .pv.hit{color:var(--cat-c)}

  .tbl{background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden}
  table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
  th{font-size:10.5px; color:var(--tx3); font-weight:500; text-align:right; padding:11px 8px; letter-spacing:.3px;
    background:rgba(255,255,255,.022); white-space:nowrap}
  th:first-child{text-align:left; padding-left:14px}
  td{font-size:12.5px; text-align:right; padding:11px 8px; border-top:1px solid var(--line)}
  td:first-child{text-align:left; padding-left:14px; font-weight:500}
  td:last-child,th:last-child{padding-right:14px}
  tr.hi td{background:rgba(224,169,95,.08)}
  tr.hi td:first-child{box-shadow:inset 3px 0 0 var(--cat-c)}
  .muted{color:var(--tx3)}
  .hot{color:var(--gold2); font-weight:700}
  .mini{display:inline-block; margin-left:5px; font-size:9.5px; color:var(--tx3)}
  .ing{display:flex; flex-wrap:wrap; gap:3px; margin-top:4px}
  .ing i{font-style:normal; font-size:9px; padding:1.5px 5px; border-radius:4px;
    background:rgba(255,255,255,.055); color:var(--tx3); white-space:nowrap}
  .ing i.on{background:var(--c); color:#fff; font-weight:600}
  .ing.mini2{margin-top:3px}
  .ing.mini2 i{font-size:8.5px; padding:1px 4px}
  .cmp td:first-child{font-weight:500}
  .cmp .dotc{display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:6px; vertical-align:1px}

  /* ---------- 雇员 ---------- */
  .buffrow{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:16px}
  .bf{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:10px 4px; text-align:center}
  .bf .bk{font-size:9.5px; color:var(--tx3); white-space:nowrap}
  .bf .bv{font-size:14px; font-weight:700; color:var(--gold2); margin-top:4px; font-variant-numeric:tabular-nums}

  .cols{display:grid; grid-template-columns:1fr 1fr; gap:9px; align-items:start}
  .col-t{display:flex; align-items:center; gap:6px; font-size:11.5px; margin:0 2px 8px; color:var(--tx2)}
  .col-t b{font-weight:600; color:var(--tx)}
  .col-t .cnt{margin-left:auto; font-size:10.5px; color:var(--tx3); font-variant-numeric:tabular-nums}
  .col-t .cnt.full{color:var(--gold)}
  .col-in{display:flex; flex-direction:column; gap:7px; min-height:60px;
    border-radius:15px; padding:8px; border:1px dashed var(--line2); background:rgba(255,255,255,.014)}
  .col-in.full{border-color:rgba(224,169,95,.3)}

  .emp{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 10px;
    cursor:pointer; transition:.16s; position:relative; overflow:hidden}
  .emp:active{transform:scale(.97)}
  .emp.on{border-color:rgba(224,169,95,.45); background:linear-gradient(120deg,#26201a,#211a17)}
  .emp.on::before{content:""; position:absolute; left:0; top:0; bottom:0; width:2.5px;
    background:linear-gradient(180deg,var(--gold2),#b8752f)}
  .emp.off{opacity:.62}
  .emp.off:hover{opacity:.9}
  .en{font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:4px}
  .en .cs{font-size:8.5px; padding:1px 4px; border-radius:4px; background:rgba(79,179,200,.2);
    color:#7fd0e0; font-weight:600; letter-spacing:.3px}
  .es{display:flex; flex-wrap:wrap; gap:3px; margin-top:5px}
  .es i{font-style:normal; font-size:9px; padding:1.5px 5px; border-radius:4px;
    background:rgba(255,255,255,.055); color:var(--tx2); white-space:nowrap}
  .es i.b1{background:rgba(224,169,95,.14); color:var(--gold2)}
  .es i.b2{background:rgba(224,169,95,.14); color:var(--gold2)}
  .es i.b3{background:rgba(126,193,140,.14); color:#8ecf9c}
  .es i.b4{background:rgba(79,179,200,.14); color:#7fd0e0}

  .reset{margin-top:14px; text-align:center; font-size:12px; color:var(--tx3); padding:11px;
    border:1px dashed var(--line2); border-radius:14px; cursor:pointer; transition:.18s}
  .reset:active{background:rgba(255,255,255,.04)}

  .note{margin-top:14px; background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:15px; padding:13px 15px}
  .note h3{font-size:11.5px; color:var(--gold); letter-spacing:.6px; margin-bottom:8px; font-weight:600}
  .note p{font-size:11.5px; color:var(--tx2); line-height:1.85}
  .note code{background:rgba(224,169,95,.12); color:var(--gold2); padding:1px 5px; border-radius:5px;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10.5px}

  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .cal .h{font-size:10px; color:var(--tx3); text-align:center; padding-bottom:2px}
  .day{aspect-ratio:1; border-radius:11px; background:var(--card); border:1px solid var(--line); position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px}
  .day .dd{font-size:12px; font-weight:600; font-variant-numeric:tabular-nums}
  .day .dc{width:6px; height:6px; border-radius:50%; background:var(--cat-bg)}
  .day.today{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset, 0 0 16px -6px var(--gold)}
  .day.today .dd{color:var(--gold2)}
  .day.eff{background:rgba(224,169,95,.11); border-color:rgba(224,169,95,.42)}
  .day.eff .dd{color:var(--gold2)}
  .day.eff .dc{width:auto; height:auto; background:transparent; font-size:7.5px; letter-spacing:.3px; color:var(--gold2)}
  .day.eff .dc::after{content:"生效"}
  .day.dim{opacity:.4}
  .legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; justify-content:center}
  .lg{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--tx2)}
  .lg i{width:8px;height:8px;border-radius:50%; display:block}

  nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px; z-index:50;
    background:rgba(20,16,14,.86); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--line2); display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0;
    font-size:10.5px; color:var(--tx3); cursor:pointer; transition:.18s; position:relative}
  .tab svg{width:20px;height:20px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  .tab.on{color:var(--gold2)}
  .tab.on::before{content:""; position:absolute; top:-8px; width:22px; height:2.5px; border-radius:2px; background:var(--gold)}
  .toast{position:fixed; bottom:102px; bottom:calc(var(--nav-h) + 24px);
    left:50%; transform:translate(-50%,14px); background:rgba(45,36,30,.96);
    border:1px solid var(--line2); color:var(--tx); padding:9px 18px; border-radius:12px; font-size:12.5px;
    opacity:0; pointer-events:none; transition:.26s; z-index:99; backdrop-filter:blur(10px); max-width:88vw; text-align:center}
  .toast.on{opacity:1; transform:translate(-50%,0)}

  /* ================= 小屏微调（≤380px） ================= */
  @media (max-width:380px){
    .stats{gap:7px; margin:0 11px 14px}
    .st{padding:10px 6px}
    .st .v{font-size:16px}
    .st .k{font-size:9.5px}
    .hero{margin:0 11px 12px; padding:14px 13px 12px}
    .views{padding:0 11px}
    .cyc{font-size:9.5px; padding:4px 1px}
    .item{padding:12px 12px; gap:10px}
    .earn .n{font-size:14px}
    .bf .bv{font-size:13px}
    .cal{gap:4px}
    .lang-sw span{font-size:9px; padding:3px 5px}
    html[lang="en"] .lang-sw span{font-size:8.5px}
    html[lang="en"] .bf .bk{font-size:8.5px}
  }

  /* ================= 平板端（600–959px） ================= */
  @media (min-width:600px) and (max-width:959px){
    .app{max-width:680px}
    nav{max-width:680px}
    .stats{gap:12px}
    .list{display:grid; grid-template-columns:1fr 1fr; gap:12px}
    .list.minis{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  }

  /* ================= 桌面端适配（≥960px） ================= */
  @media (min-width:960px){
    .app{
      max-width:1220px; padding:0 0 44px;
      display:grid; min-height:100vh;
      grid-template-columns:212px minmax(0,1fr);
      align-items:start;
    }
    .app>.main{grid-column:2; grid-row:1; align-self:stretch;
      display:flex; flex-direction:column}

    /* 顶栏 */
    header{padding:22px 28px 16px}
    .logo{width:38px;height:38px;border-radius:12px;font-size:20px}
    h1{font-size:19px}
    .sub{font-size:11.5px; letter-spacing:2.4px}
    .hd-date{font-size:12px}
    .hd-date b{font-size:13px}
    .hd-right{flex-direction:row; align-items:center; gap:14px}
    .lang-sw span{font-size:10.5px; padding:4px 9px}
    html[lang="en"] h1{font-size:17px}

          · Ingredient matches today's trend → base price gets an extra <code>+trend bonus</code> before calculation<br>
          · No match → calculated on the adjusted price only<br>
          Adj. price = (Base price + Price add) × (1 + Price add%)<br>
          Revenue = Adj. price × 24 × Traffic multiplier
        </p>`,
    empNote:`<h3>Rules</h3>
        <p>
          Up to <code>10 employees + 1 exclusive customer service</code>; only bonuses on the "Deployed" side count.<br>
          Total traffic = (2400 + ΣTraffic) × (1 + ΣTraffic%)<br>
          Traffic multiplier = Total traffic ÷ 2400<br>
          With the default lineup: (2400 + 297) × 1.035 = <code>2791.40</code>, multiplier <code>1.1631×</code>
        </p>`,
    calNote:`<h3>Cycle Order</h3>
            <p>Main Dishes → Desserts → Beverages → Flour → Fruit → Coffee Beans, one cycle every 6 days. Main Dishes / Desserts / Beverages have a bonus of <code>1</code>; Flour / Fruit / Coffee Beans <code>0.75</code>.</p>
            <p style="margin-top:7px">The bonus takes effect at <b style="color:var(--gold2)">12:00 daily</b>; before 12:00 the previous day's bonus still applies (the gold "ON" cell marks the currently active day).</p>`,
  }
};

let LANG = 'zh';

function T(k, v){
  const d = I18N[LANG] || I18N.zh;
  let s = (d[k] !== undefined) ? d[k] : (I18N.zh[k] !== undefined ? I18N.zh[k] : k);
  if(v) for(const p in v) s = s.split('{'+p+'}').join(v[p]);
  return s;
}
function TA(k){ const d = I18N[LANG] || I18N.zh; return d[k] !== undefined ? d[k] : I18N.zh[k]; }
function catName(c, short){ return LANG==='en' ? ((short ? CAT_EN_S[c] : CAT_EN[c]) || c) : c; }
function prodName(p){ return LANG==='en' ? (PROD_EN[p.n] || p.n) : p.n; }
function empName(n){ return LANG==='en' ? (EMP_EN[n] || n) : n; }
function weekdayName(d){ return LANG==='en' ? TA('weekdays')[d.getDay()] : '周' + TA('weekdays')[d.getDay()]; }

function applyLang(){
  document.documentElement.lang = LANG==='en' ? 'en' : 'zh-CN';
  document.title = T('docTitle');
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent = T(el.dataset.t); });
  document.querySelectorAll('[data-th]').forEach(el=>{ el.innerHTML = T(el.dataset.th); });
  document.querySelectorAll('#langSw span[data-l]').forEach(el=> el.classList.toggle('on', el.dataset.l === LANG));
}
function setLang(l){
  LANG = (l === 'en') ? 'en' : 'zh';
  S.lang = LANG;
  applyLang();
  render();
}

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function dayIdx(d){ return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - BASE_DAY)/86400000); }
function catOf(d){ return CATS[((dayIdx(d)%6)+6)%6]; }
/* 生效日：12:00 前仍沿用前一日（对应表格 B12 = INT(NOW()-TIME(12,0,0))） */
function effDate(now){
  const n = now || new Date();
  const d = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  if(n.getHours() < 12) d.setDate(d.getDate() - 1);
  return d;
}
/* 下一次切换时刻：今天 12:00，若已过则为明天 12:00 */
function nextSwitch(now){
  const n = now || new Date();
  const t = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 12, 0, 0, 0);
  if(n.getHours() >= 12) t.setDate(t.getDate() + 1);
  return t;
}
function fmt(n,dp){
  if(!isFinite(n)) return '0';
  const d = dp===undefined ? (Math.abs(n)>=1000?0:1) : dp;
  return n.toLocaleString(LANG==='en'?'en-US':'zh-CN',{minimumFractionDigits:d, maximumFractionDigits:d});
}
function trim(n){ return (Math.round(n*100)/100).toString(); }

/* ================= 状态 ================= */
let S = {sel: DEF_SEL.slice(), date: ymd(effDate()), auto: true, used: DEF_USED.slice(), cs: true, lang:'zh', fold:true};

/* ================= 计算 ================= */
function buffs(){
  const b = {flow:0, sellAdd:0, sellPct:0, flowPct:0};
  EMP.forEach(e=>{ if(S.used.includes(e.n)) for(const k in e.s) b[k]+=e.s[k]; });
  if(S.cs) for(const k in CS.s) b[k]+=CS.s[k];
  return b;
}
function calc(){
  const b = buffs();
  const flow = (BASE_FLOW + b.flow) * (1 + b.flowPct/100);
  const flowMul = flow / BASE_FLOW;
  const cat = catOf(parseYmd(S.date));

  /* 单品在某风向标下的收益：命中原料才加成
     · 命中：表格 E 列写法 (基础价 + 加成 + 售价加成) × (1+售价加成%) × 24 × 人流量加成
     · 咖啡豆列在表格里用的是 C+B14 的写法，此处保持与原表一致 */
  const valueFor = (p, c) => {
    const mk = 1 + b.sellPct/100;
    const C  = (p.p + b.sellAdd) * mk;
    const t  = 24 * flowMul;
    if(!p.ing.includes(c)) return C * t;
    if(c === '咖啡豆')     return (C + CAT_ADD[c]) * t;
    return (p.p + CAT_ADD[c] + b.sellAdd) * mk * t;
  };

  const rows = PRODUCTS.map(p=>{
    const price = (p.p + b.sellAdd) * (1 + b.sellPct/100);
    const hit = p.ing.includes(cat);
    return {p, price, no: price*24*flowMul, hit, val: valueFor(p, cat)};
  });
  const rev = S.sel.reduce((s,i)=> s + (rows[i] ? rows[i].val : 0), 0);

  /* 各风向标下的小时营收对照 */
  const cmp = CATS.map(c=>({
    c, add: CAT_ADD[c],
    rev: S.sel.reduce((s,i)=> s + (PRODUCTS[i] ? valueFor(PRODUCTS[i], c) : 0), 0),
    n:   S.sel.filter(i=> PRODUCTS[i] && PRODUCTS[i].ing.includes(c)).length,
  }));

  return {b, flow, flowMul, cat, rows, rev, cmp};
}

/* ================= 渲染 ================= */
function paintNote(){
  const now = new Date();
  const ns = nextSwitch(now);
  const ms = Math.max(0, ns - now);
  const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000), s = Math.floor(ms%60000/1000);
  const clock = h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  const after = new Date(ns.getFullYear(), ns.getMonth(), ns.getDate());
  $('#heroNote').innerHTML = T(S.auto ? 'noteAuto' : 'noteManual',
    {clock, date: ymd(after).slice(5).replace('-','.'), cat: catName(catOf(after))});
}

function paint(el, cat, glow){
  el.style.setProperty('--cat-bg', CAT_COLOR[cat]);
  el.style.setProperty('--cat-c', CAT_COLOR[cat]);
  if(glow) el.style.setProperty('--cat-glow', CAT_COLOR[cat]+'55');
}
const STAT_META = [
  ['flow',   'kFlow',    'b1'],
  ['sellAdd','kSellAdd', 'b2'],
  ['sellPct','kSellPct', 'b3'],
  ['flowPct','kFlowPct', 'b4'],
];

function render(){
  const R = calc(), b = R.b;
  const d = parseYmd(S.date);

  const eff = effDate();
  $('#todayStr').textContent = ymd(eff).replace(/-/g,'.');
  $('#todayCat').textContent = T('todayCat', {cat: catName(catOf(eff))});

  $('#btnAuto').style.display = S.auto ? 'none' : 'inline-block';
  paintNote();

  $('#dateIn').value = S.date;
  $('#weekday').textContent = weekdayName(d);
  $('#trendName').textContent = catName(R.cat);
  $('#trendAdd').textContent = '×' + CAT_ADD[R.cat];
  paint($('#hero'), R.cat, true);
  paint($('#trendChip'), R.cat, false);
  $('#trendTip').textContent = T('tip', {n: CAT_ADD[R.cat]});
  $('#cycle').innerHTML = CATS.map(c=>
    `<div class="cyc ${c===R.cat?'on':''}" style="--cat-bg:${CAT_COLOR[c]}">${catName(c,true)}</div>`).join('');

  $('#sRev').innerHTML  = fmt(R.rev,2) + '<span class="u">/h</span>';
  $('#sMul').innerHTML  = R.flowMul.toFixed(4) + '<span class="u">×</span>';
  $('#sFlow').innerHTML = fmt(R.flow,0);

  /* 上架商品：已选的完整展示，未选的折叠成一行 */
  $('#selCount').textContent = T('selCount', {n: S.sel.length, t: PRODUCTS.length});
  const ingTags = (p, cat, mini) =>
    `<div class="ing${mini?' mini2':''}">` +
    p.ing.map(c=>`<i class="${c===cat?'on':''}" style="--c:${CAT_COLOR[c]}">${catName(c)}</i>`).join('') +
    `</div>`;

  let selHtml = '', idleHtml = '';
  R.rows.forEach((r,i)=>{
    if(!S.sel.includes(i)){
      idleHtml += `<div class="item mini" data-i="${i}" style="--cat-c:${CAT_COLOR[R.cat]}">
        <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#1a1411" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg></div>
        <div class="nm">${prodName(r.p)}</div>
        <div class="pv ${r.hit?'hit':''}">${r.p.p}</div>
      </div>`;
      return;
    }
    const diff = r.val - r.no;
    selHtml += `<div class="item sel ${r.hit?'hit':''}" data-i="${i}" style="--cat-c:${r.hit?CAT_COLOR[R.cat]:'rgba(255,255,255,.12)'}">
      <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#1a1411" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg></div>
      <div class="info">
        <div class="nm">${prodName(r.p)}</div>
        ${ingTags(r.p, R.cat)}
        <div class="mt">
          <span>${T('itemBase')} <b>${r.p.p}</b></span>
          <span>${T('itemAdj')} <b>${fmt(r.price,2)}</b></span>
          <span>${r.hit ? '<span style="color:'+CAT_COLOR[R.cat]+'">'+T('itemHit',{cat:catName(R.cat)})+'</span>' : T('itemMiss')}</span>
        </div>
      </div>
      <div class="earn">
        <div class="n">${fmt(r.val,0)}</div>
        <div class="d ${r.hit?'up':''}">${r.hit ? '↑ +'+fmt(diff,0) : fmt(r.no,0)}</div>
      </div>
    </div>`;
  });
  $('#selList').innerHTML = selHtml;
  $('#idleList').innerHTML = idleHtml;

  /* 未选商品折叠栏 */
  const idleN = PRODUCTS.length - S.sel.length;
  $('#idleWrap').classList.toggle('hide', idleN === 0);
  $('#foldBar').classList.toggle('on', idleN > 0);
  $('#idleList').classList.toggle('hide', S.fold || idleN === 0);
  $('#foldBar').classList.toggle('open', !S.fold);
  $('#foldText').textContent = T(S.fold ? 'foldShow' : 'foldHide', {n: idleN});

  /* 各风向标对照 */
  $('#cmpBody').innerHTML = R.cmp.map(o=>
    `<tr class="${o.c===R.cat?'hi':''}" style="--cat-c:${CAT_COLOR[o.c]}">
       <td><span class="dotc" style="background:${CAT_COLOR[o.c]}"></span>${catName(o.c)}</td>
       <td class="muted">+${o.add}</td>
       <td class="muted">${o.n}</td>
       <td class="${o.c===R.cat?'hot':''}">${fmt(o.rev,2)}</td></tr>`).join('');

  /* 商品总览 */
  $('#goodsCat').textContent = T('goodsCat', {cat: catName(R.cat), n: CAT_ADD[R.cat]});
  $('#goodsBody').innerHTML = R.rows.map(r=>
    `<tr class="${r.hit?'hi':''}" style="--cat-c:${r.hit?CAT_COLOR[R.cat]:'rgba(255,255,255,.12)'}">
       <td>${prodName(r.p)}${ingTags(r.p, R.cat, true)}</td>
       <td class="muted">${r.p.p}</td><td>${fmt(r.price,2)}</td>
       <td class="${r.hit?'muted':''}">${fmt(r.no,0)}</td>
       <td class="${r.hit?'hot':'muted'}">${fmt(r.val,0)}</td></tr>`).join('');

  /* 加成汇总 */
  $('#b-flow').textContent    = '+' + trim(b.flow);
  $('#b-sellAdd').textContent = '+' + trim(b.sellAdd);
  $('#b-sellPct').textContent = '+' + trim(b.sellPct);
  $('#b-flowPct').textContent = '+' + trim(b.flowPct);

  /* 雇员编排 */
  const usedEmp = EMP.filter(e=>S.used.includes(e.n));
  const idleEmp = EMP.filter(e=>!S.used.includes(e.n));
  const card = e => {
    const chips = STAT_META.filter(([k])=> e.s[k]!==undefined)
      .map(([k,label,cls])=>`<i class="${cls}">${T(label)} +${trim(e.s[k])}</i>`).join('');
    return `<div class="emp ${S.used.includes(e.n)?'on':'off'}" data-n="${e.n}" data-cs="0">
      <div class="en">${empName(e.n)}</div><div class="es">${chips}</div></div>`;
  };
  const csCard = on => `<div class="emp ${on?'on':'off'}" data-n="${CS.n}" data-cs="1">
      <div class="en">${T('csName')}<span class="cs">${T('csTag')}</span></div>
      <div class="es"><i class="b4">${T('kFlowPct')} +1</i></div></div>`;

  $('#col-used').innerHTML = usedEmp.map(card).join('') + (S.cs ? csCard(true) : '');
  $('#col-idle').innerHTML = idleEmp.map(card).join('') + (S.cs ? '' : csCard(false));

  const usedN = usedEmp.length + (S.cs ? 1 : 0);
  $('#c-used').textContent = `${usedN} / ${MAX_EMP + 1}`;
  $('#c-used').className = 'cnt' + (usedEmp.length >= MAX_EMP ? ' full' : '');
  $('#c-idle').textContent = `${idleEmp.length + (S.cs ? 0 : 1)}`;
  $('#col-used').className = 'col-in' + (usedEmp.length >= MAX_EMP ? ' full' : '');

  /* 日历 */
  const start = parseYmd(S.date);
  $('#calHead').innerHTML = TA('weekdays').map(x=>`<div class="h">${x}</div>`).join('');
  let cells = '';
  for(let i=0;i<start.getDay();i++) cells += '<div></div>';
  for(let i=0;i<28;i++){
    const dd = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    const c = catOf(dd), k = ymd(dd), isEff = k === ymd(effDate());
    cells += `<div class="day ${k===S.date?'today':''} ${isEff?'eff':''} ${i>13?'dim':''}" style="--cat-bg:${CAT_COLOR[c]}" data-d="${k}" title="${catName(c)}">
      <div class="dd">${dd.getDate()}</div><div class="dc"></div></div>`;
  }
  $('#calGrid').innerHTML = cells;
  $('#legend').innerHTML = CATS.map(c=>`<div class="lg"><i style="background:${CAT_COLOR[c]}"></i>${catName(c)}</div>`).join('');

  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

/* ================= 响应式视图切换 ================= */
let curView = 'earn';
const mqPC = window.matchMedia('(min-width: 960px)');

const allTabs  = () => document.querySelectorAll('.tab');
const allViews = () => document.querySelectorAll('.view');

function applyViews(){
  const pc = mqPC.matches;
  allViews().forEach(v=> v.classList.toggle('on', pc || v.id === 'v-' + curView));
}
function setTab(name){
  curView = name;
  allTabs().forEach(t=> t.classList.toggle('on', t.dataset.v === name));
}
function goView(name){
  setTab(name); applyViews();
  if(mqPC.matches){                       /* 大屏：滚动定位到区块 */
    const el = document.getElementById('v-' + name);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }else{                                  /* 小屏：切换视图并回顶 */
    window.scrollTo({top:0, behavior:'smooth'});
  }
}
/* 大屏滚动联动侧栏高亮 */
function scrollSpy(){
  if(!mqPC.matches) return;
  const views = [...allViews()];
  let name = curView;
  views.forEach(v=>{ if(v.getBoundingClientRect().top <= 150) name = v.id.slice(2); });
  /* 已滚到底部时，最后一屏即当前区块（避免高亮回退） */
  if(views.length && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 8)
    name = views[views.length-1].id.slice(2);
  if(name !== curView) setTab(name);
}
/* 底部菜单栏真实高度（含 iPhone 安全区）→ 写入 --nav-h，
   供 .app 的 padding-bottom 与 toast 定位使用，避免内容被底栏盖住 */
function syncNavH(){
  const nav = document.querySelector('nav');
  if(!nav) return;
  const h = mqPC.matches ? 0 : nav.offsetHeight;
  document.documentElement.style.setProperty('--nav-h', h + 'px');
}
function onMQChange(){
  applyViews();
  syncNavH();
  if(mqPC.matches) scrollSpy();
}
window.addEventListener('resize', syncNavH);
window.addEventListener('orientationchange', syncNavH);
if(mqPC.addEventListener) mqPC.addEventListener('change', onMQChange);
else if(mqPC.addListener) mqPC.addListener(onMQChange);
window.addEventListener('scroll', scrollSpy, {passive:true});

/* ================= 交互 ================= */
document.addEventListener('click', e=>{
  const tab = e.target.closest('.tab');
  if(tab){ goView(tab.dataset.v); return; }
  if(e.target.closest('#foldBar')){ S.fold = !S.fold; render(); return; }
  const it = e.target.closest('.item');
  if(it){
    const i = +it.dataset.i, k = S.sel.indexOf(i);
    if(k>-1) S.sel.splice(k,1); else S.sel.push(i);
    S.sel.sort((a,b)=>a-b); render(); return;
  }
  const emp = e.target.closest('.emp');
  if(emp){
    if(emp.dataset.cs === '1'){ S.cs = !S.cs; render(); return; }
    const n = emp.dataset.n, k = S.used.indexOf(n);
    if(k>-1) S.used.splice(k,1);
    else {
      if(S.used.length >= MAX_EMP){ toast(T('toastMax',{n:MAX_EMP})); return; }
      S.used.push(n);
      S.used = EMP_NAMES.filter(x=>S.used.includes(x));
    }
    render(); return;
  }
  const day = e.target.closest('.day');
  if(day){ S.date = day.dataset.d; S.auto = false; render(); toast(T('toastSwitch',{d:S.date})); return; }
});

$('#langSw').addEventListener('click', e=>{
  const s = e.target.closest('span[data-l]');
  if(!s || s.dataset.l === LANG) return;
  const l = s.dataset.l;
  setLang(l);
  toast(T('toastLang', {l: I18N[l] ? I18N[l].langLabel : l}));
});

$('#dateIn').addEventListener('change', e=>{
  if(e.target.value){ S.date = e.target.value; S.auto = false; render(); }
});

$('#btnAuto').addEventListener('click', ()=>{
  S.auto = true; S.date = ymd(effDate()); render(); toast(T('toastBack'));
});

$('#btnReset').addEventListener('click', ()=>{
  S.used = DEF_USED.slice(); S.cs = true; render(); toast(T('toastReset'));
});

function toast(t){
  const el = $('#toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('on'), 1700);
}

/* ================= 启动 ================= */
(function init(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(o && typeof o==='object'){
        S = Object.assign(S, o);
        if(!Array.isArray(S.used)) S.used = DEF_USED.slice();
        S.used = EMP_NAMES.filter(n=>S.used.includes(n)).slice(0, MAX_EMP);
        S.cs = o.cs !== false;
        S.auto = o.auto !== false;
      }
    }
  }catch(e){}
  if(!Array.isArray(S.sel) || !S.sel.length) S.sel = DEF_SEL.slice();
  if(S.auto || !S.date) S.date = ymd(effDate());
  const ql = new URLSearchParams(location.search).get('lang');   /* ?lang=en 可直接进英文 */
  if(ql === 'en' || ql === 'zh') S.lang = ql;
  LANG = (S.lang === 'en') ? 'en' : 'zh';
  applyLang();
  render();
  applyViews();
  syncNavH();

  setInterval(()=>{
    const eff = ymd(effDate());
    if(S.auto && eff !== S.date){ S.date = eff; render(); return; }   // 12:00 到点自动切换
    paintNote();
  }, 1000);
})();
</script>
